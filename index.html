<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学乐园</title> <!-- Changed title -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>数学乐园</h1> <!-- Changed title -->
            <nav class="mode-selection">
                <button id="btnLearningMode" class="mode-button" onclick="showLearningMode()">🎓 学习模式</button>
                <button id="btnPracticeMode" class="mode-button" onclick="showPracticeMode()">🖼️ 练习模式</button>
            </nav>
        </header>
        <main>
            <div id="learningMode" class="mode-content" style="display:none;">
                <h2 class="mode-title">学习模式</h2>
                <div id="learningQuestionArea" class="question-area">
                    <p id="learningQuestionText" class="question-text"></p>
                    <input type="text" id="learningAnswerInput" class="answer-input" placeholder="在这里输入答案">
                    <button id="submitLearningAnswer" class="submit-button">提交</button>
                </div>
                <div id="learningFeedback" class="feedback-message" style="min-height: 20px; margin-top: 10px;"></div>
                <div id="learningScore" class="score-display">💰 金币: 0</div>
                <div id="posterArea" class="poster-container" style="text-align: center; margin-top: 20px;">
                    <img id="rewardPoster" src="placeholder_poster.png" alt="奖励海报" style="display:none; cursor:pointer; max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
                </div>
                <div id="endGameMessage" class="end-game-message" style="text-align: center; margin-top: 15px;"></div>
            </div>

            <div id="practiceMode" class="mode-content" style="display:none;">
                <h2 class="mode-title">练习模式</h2>
                <div id="practiceArea" class="game-area">
                    <div id="practiceImageContainer" class="image-container" style="position: relative; width: 300px; height: 240px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                        <img id="practiceFullImage" src="placeholder_practice_image.png" alt="练习图片" style="display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; border-radius: 8px;">
                        <div id="practiceImageGrid" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); border-radius: 8px; overflow: hidden;">
                            <!-- Grid blocks will be generated by JavaScript -->
                        </div>
                        <div id="fullImageFireworksOverlay"></div> <!-- Added from previous subtask, ensure it's here -->
                    </div>
                    <div id="practiceQuestionArea" class="question-area" style="margin-top: 20px; text-align: center;">
                        <p id="practiceQuestionText" class="question-text"></p>
                        <input type="text" id="practiceAnswerInput" class="answer-input" placeholder="在这里输入答案">
                        <button id="submitPracticeAnswer" class="submit-button">提交</button>
                        <div id="practiceFeedback" class="feedback-message" style="min-height: 20px; margin-top: 10px;"></div>
                        <div id="practiceExplanationArea" class="explanation-area" style="min-height: 20px; margin-top: 10px;"></div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <p class="footer-text">© 2024 数学乐园</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
